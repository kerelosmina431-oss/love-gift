<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>خطفتي قلبي بعنيكي ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0d0614;
      --bg-mid: #1f0a24;
      --primary: #ff4d79;
      --primary-glow: rgba(255, 77, 121, 0.45);
      --gold: #ffd180;
      --glass-bg: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.14);
      --text-main: #fff5f8;
      --text-muted: #d4b8c4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Cairo', sans-serif;
      background: radial-gradient(circle at top, var(--bg-mid), var(--bg-dark) 75%);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    #particles-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* ================= شاشة القفل ================= */
    #lock-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at center, #260c2b 0%, #09030f 100%);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    #lock-screen.unlocked {
      opacity: 0;
      transform: scale(1.08);
      pointer-events: none;
    }

    .lock-card {
      background: var(--glass-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 40px 30px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 40px var(--primary-glow);
      animation: floatCard 4s ease-in-out infinite;
    }

    @keyframes floatCard {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .heart-lock-icon {
      font-size: 3.5rem;
      margin-bottom: 15px;
      display: inline-block;
      animation: heartbeat 1.5s infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.15); }
      50% { transform: scale(1); }
      75% { transform: scale(1.12); }
    }

    .lock-card h1 {
      font-family: 'Amiri', serif;
      font-size: 1.9rem;
      margin-bottom: 8px;
      color: var(--gold);
    }

    .lock-card p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    .pass-input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      border: 1px solid var(--glass-border);
      background: rgba(0, 0, 0, 0.35);
      color: #fff;
      font-size: 1.1rem;
      text-align: center;
      letter-spacing: 3px;
      outline: none;
      margin-bottom: 16px;
      transition: 0.3s;
    }

    .pass-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 15px var(--primary-glow);
    }

    .unlock-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #ff4d79, #c9184a);
      color: white;
      font-family: 'Cairo', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 8px 25px var(--primary-glow);
    }

    .unlock-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(255, 77, 121, 0.65);
    }

    .error-msg {
      color: #ff8fa3;
      font-size: 0.88rem;
      margin-top: 12px;
      min-height: 20px;
    }

    .shake { animation: shake 0.4s ease; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    /* ================= المحتوى الرئيسي ================= */
    #main-content {
      position: relative;
      z-index: 1;
      max-width: 850px;
      margin: 0 auto;
      padding: 30px 20px 90px;
      opacity: 0;
      transition: opacity 1s ease;
    }

    #main-content.visible { opacity: 1; }

    /* مشغل الموسيقى العائم */
    .music-bar {
      position: sticky;
      top: 15px;
      z-index: 50;
      background: rgba(25, 10, 32, 0.85);
      backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
      border-radius: 50px;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 35px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .song-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .disc {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--gold));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      animation: spin 6s linear infinite;
      animation-play-state: paused;
      flex-shrink: 0;
    }

    .disc.playing { animation-play-state: running; }

    @keyframes spin { 100% { transform: rotate(360deg); } }

    .play-btn {
      background: var(--primary);
      border: none;
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
      flex-shrink: 0;
    }

    .play-btn:hover { transform: scale(1.08); }

    /* الهيدر والعداد */
    .hero { text-align: center; margin-bottom: 40px; }

    .hero h2 {
      font-family: 'Amiri', serif;
      font-size: 2.6rem;
      color: var(--gold);
      margin-bottom: 10px;
      text-shadow: 0 4px 20px rgba(255, 209, 128, 0.25);
    }

    .counter-box {
      display: inline-flex;
      gap: 15px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      padding: 14px 24px;
      border-radius: 20px;
      margin-top: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .counter-item span {
      display: block;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary);
    }

    .counter-item small { color: var(--text-muted); font-size: 0.8rem; }

    /* كارت البوست / الرسالة */
    .love-post {
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
      border-radius: 26px;
      padding: 35px 30px;
      margin-bottom: 40px;
      position: relative;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
    }

    .love-post::before {
      content: "❝";
      position: absolute;
      top: 12px;
      right: 22px;
      font-size: 4rem;
      color: rgba(255, 77, 121, 0.2);
      font-family: 'Amiri', serif;
    }

    .post-title {
      font-family: 'Amiri', serif;
      font-size: 1.7rem;
      color: var(--primary);
      margin-bottom: 16px;
    }

    .post-body {
      font-size: 1.12rem;
      line-height: 2;
      color: #f8e8ee;
      white-space: pre-line;
    }

    .post-signature {
      margin-top: 22px;
      text-align: left;
      font-family: 'Amiri', serif;
      font-size: 1.3rem;
      color: var(--gold);
    }

    /* ألبوم الصور */
    .gallery-section h3 {
      font-family: 'Amiri', serif;
      font-size: 1.9rem;
      text-align: center;
      color: var(--gold);
      margin-bottom: 24px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }

    .photo-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.35s ease, box-shadow 0.35s ease;
    }

    .photo-card:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 15px 35px var(--primary-glow);
    }

    .photo-card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      display: block;
    }

    .photo-caption {
      padding: 14px;
      text-align: center;
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      flex-direction: column;
    }

    .lightbox.open { display: flex; }

    .lightbox img {
      max-width: 90%;
      max-height: 78vh;
      border-radius: 16px;
      border: 2px solid var(--primary);
    }

    .lightbox p { margin-top: 14px; font-size: 1.1rem; color: var(--gold); }
  </style>
</head>
<body>

  <canvas id="particles-canvas"></canvas>

  <!-- 1. شاشة القفل -->
  <div id="lock-screen">
    <div class="lock-card" id="lock-card">
      <div class="heart-lock-icon">💖</div>
      <h1>مكاننا السري</h1>
      <p>اكتبي الباسورد عشان تفتحي الرسالة...</p>
      <input type="password" id="password-input" class="pass-input" placeholder="••••" />
      <button class="unlock-btn" onclick="checkPassword()">افتحي قلبي 🔓</button>
      <div class="error-msg" id="error-msg"></div>
    </div>
  </div>

  <!-- 2. محتوى الموقع بعد الفتح -->
  <div id="main-content">
    
    <!-- مشغل الأغنية -->
    <div class="music-bar">
      <div class="song-info">
        <div class="disc" id="disc">🎵</div>
        <div>
          <strong id="song-title" style="display:block; font-size:0.95rem;">أهنيكي - يحيى علاء ❤️</strong>
          <small id="song-status" style="color: var(--text-muted); font-size:0.78rem;">شغّالة ليكي أول ما فتحتي</small>
        </div>
      </div>
      <button class="play-btn" id="play-btn" onclick="toggleMusic()">▶</button>
    </div>

    <header class="hero">
      <h2 id="hero-title">أهنيكي.. خطفتي قلبي بعنيكي ❤️</h2>
      <p style="color: var(--text-muted);">كل ثانية معاكي بتفرق في عمري</p>
      <div class="counter-box" id="love-counter"></div>
    </header>

    <section class="love-post">
      <h3 class="post-title" id="post-heading">كلام طالع من قلبي..</h3>
      <div class="post-body" id="post-text"></div>
      <div class="post-signature" id="post-sign">حبيبك للأبد ✨</div>
    </section>

    <section class="gallery-section">
      <h3>أجمل ذكرياتنا 📸</h3>
      <div class="gallery-grid" id="gallery-grid"></div>
    </section>

  </div>

  <div class="lightbox" id="lightbox" onclick="this.classList.remove('open')">
    <img id="lightbox-img" src="" alt="">
    <p id="lightbox-caption"></p>
  </div>

  <audio id="bg-music" src="Ahaneksong.mp3" preload="auto" loop></audio>

  <script>
    // ========================================================
    // 👇 عدّل بياناتك هنا بسهولة 👇
    // ========================================================
    const CONFIG = {
      password: "2026", // كلمة السر
      startDate: "2025-02-14", // تاريخ بدايتكم (سنة-شهر-يوم)
      songTitle: "أهنيكي - يحيى علاء ❤️",
      songFile: "Ahaneksong.mp3", // نفس اسم الملف اللي في الفولدر عندك
      heroTitle: "أهنيكي.. خطفتي قلبي بعنيكي ❤️",
      postHeading: "كلام طالع من قلبي..",
      postMessage: `يمكن الكلام عمره ما هيكفي يوصف قد إيه وجودك في حياتي غير حاجات كتير للأحسن.
من يوم ما عرفتك وكل يوم بقى ليه طعم ومعنى تاني.
عملتلك الصفحة الصغيرة دي عشان تفضل ذكرى بينا، وكل ما تفتحيها تفتكري إن في حد بيحبك من قلبه وموجود عشانك دايماً.`,
      signature: "حبيبك للأبد ✨",
      
      photos: [
        {
          src: "https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=600&q=80",
          caption: "أول ذكرى حلوة لينا 💕"
        },
        {
          src: "https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=600&q=80",
          caption: "ضحكتك بالدنيا كلها ✨"
        },
        {
          src: "https://images.unsplash.com/photo-1529333166437-7750a6dd5a70?w=600&q=80",
          caption: "معاكي الوقت بيعدي بسرعة 🌹"
        }
      ]
    };
    // ========================================================

    document.getElementById("hero-title").textContent = CONFIG.heroTitle;
    document.getElementById("post-heading").textContent = CONFIG.postHeading;
    document.getElementById("post-text").textContent = CONFIG.postMessage;
    document.getElementById("post-sign").textContent = CONFIG.signature;
    document.getElementById("song-title").textContent = CONFIG.songTitle;

    const audio = document.getElementById("bg-music");
    const songStatus = document.getElementById("song-status");
    audio.src = CONFIG.songFile;

    function playMusic() {
      audio.volume = 1.0;
      audio.play().then(() => {
        document.getElementById("disc").classList.add("playing");
        document.getElementById("play-btn").textContent = "⏸";
        songStatus.textContent = "شغّالة ليكي دلوقتي 🎶";
      }).catch(() => {
        document.getElementById("play-btn").textContent = "▶";
      });
    }

    function toggleMusic() {
      if (audio.paused) {
        playMusic();
      } else {
        audio.pause();
        document.getElementById("disc").classList.remove("playing");
        document.getElementById("play-btn").textContent = "▶";
        songStatus.textContent = "متوقفة مؤقتاً";
      }
    }

    // بناء ألبوم الصور
    const galleryGrid = document.getElementById("gallery-grid");
    CONFIG.photos.forEach(photo => {
      const card = document.createElement("div");
      card.className = "photo-card";
      card.innerHTML = `
        <img src="${photo.src}" alt="ذكرى">
        <div class="photo-caption">${photo.caption}</div>
      `;
      card.onclick = () => {
        document.getElementById("lightbox-img").src = photo.src;
        document.getElementById("lightbox-caption").textContent = photo.caption;
        document.getElementById("lightbox").classList.add("open");
      };
      galleryGrid.appendChild(card);
    });

    // التحقق من الباسورد وتشغيل الأغنية فوراً
    const passInput = document.getElementById("password-input");
    passInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") checkPassword();
    });

    function checkPassword() {
      const entered = passInput.value.trim();
      const errorMsg = document.getElementById("error-msg");
      const lockCard = document.getElementById("lock-card");

      if (entered === CONFIG.password) {
        playMusic();
        document.getElementById("lock-screen").classList.add("unlocked");
        document.getElementById("main-content").classList.add("visible");
      } else {
        errorMsg.textContent = "الباسورد غلط.. حاولي تاني يا جميلة 💔";
        lockCard.classList.remove("shake");
        void lockCard.offsetWidth;
        lockCard.classList.add("shake");
      }
    }

    // عداد الحب
    function updateCounter() {
      const start = new Date(CONFIG.startDate);
      const now = new Date();
      const diff = Math.max(0, now - start);

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / 1000 / 60) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById("love-counter").innerHTML = `
        <div class="counter-item"><span>${days}</span><small>يوم</small></div>
        <div class="counter-item"><span>${hours}</span><small>ساعة</small></div>
        <div class="counter-item"><span>${minutes}</span><small>دقيقة</small></div>
        <div class="counter-item"><span>${seconds}</span><small>ثانية</small></div>
      `;
    }
    setInterval(updateCounter, 1000);
    updateCounter();

    // خلفية القلوب المتطايرة
    const canvas = document.getElementById("particles-canvas");
    const ctx = canvas.getContext("2d");
    let particles = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    for (let i = 0; i < 28; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 14 + 8,
        speedY: Math.random() * 0.7 + 0.3,
        opacity: Math.random() * 0.5 + 0.2
      });
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        ctx.globalAlpha = p.opacity;
        ctx.font = `${p.size}px Arial`;
        ctx.fillText("❤️", p.x, p.y);
        p.y -= p.speedY;
        if (p.y < -20) {
          p.y = canvas.height + 20;
          p.x = Math.random() * canvas.width;
        }
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();
  </script>
</body>
</html>
